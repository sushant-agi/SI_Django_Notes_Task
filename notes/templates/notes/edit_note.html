{% extends 'notes/base.html' %}

{% block title %}Edit Note{% endblock %}

{% block content %}

<div class="container">

    <div class="card">

        <h1>Edit Note</h1>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <label for="title">Title</label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ note.title }}"
                required
            >
            <br> <br> 

            <label for="image">Image</label>

            {% if note.image %}
                <div id="current-image-container">

                    <p>Current Image:</p>

                    <img
                        id="current-image"
                        src="{{ note.image.url }}"
                        alt="Current image"
                    >

                    <button type="button" id="remove-current-image">
                        Remove Image
                    </button>

                </div>
            {% endif %}


            <input
                type="file"
                id="image"
                name="image"
                accept="image/*"
            >

            <div id="image-preview-container" style="display: none;">

                <p>New Image Preview:</p>

                <img
                    id="image-preview"
                    src=""
                    alt="New image preview"
                >

                <button type="button" id="remove-new-image">
                    Remove New Image
                </button>

            </div>

            <!-- Tells Django whether the existing image should be deleted -->
            <input
                type="hidden"
                id="remove_existing_image"
                name="remove_existing_image"
                value="false"
            >
            <br><br>

            <label for="content">Content</label>

            <textarea
                id="content"
                name="content"
                rows="10"
                required
            >{{ note.content }}</textarea>

            <div class="form-actions">

                <button type="submit">
                    Update Note
                </button>

                <a
                    href="{% url 'home' %}"
                    class="button secondary-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

<script>

    const imageInput = document.getElementById("image");

    const currentImageContainer =
        document.getElementById("current-image-container");

    const currentImage =
        document.getElementById("current-image");

    const removeCurrentImage =
        document.getElementById("remove-current-image");

    const previewContainer =
        document.getElementById("image-preview-container");

    const imagePreview =
        document.getElementById("image-preview");

    const removeNewImage =
        document.getElementById("remove-new-image");

    const removeExistingImage =
        document.getElementById("remove_existing_image");


    // Preview newly selected image

    imageInput.addEventListener("change", function () {

        const file = imageInput.files[0];

        if (file) {

            imagePreview.src = URL.createObjectURL(file);

            previewContainer.style.display = "block";

        }

    });


    // Remove existing image

    if (removeCurrentImage) {

        removeCurrentImage.addEventListener("click", function () {

            currentImageContainer.style.display = "none";

            removeExistingImage.value = "true";

        });

    }


    // Remove newly selected image

    removeNewImage.addEventListener("click", function () {

        imageInput.value = "";

        imagePreview.src = "";

        previewContainer.style.display = "none";

    });

</script>

{% endblock %}
