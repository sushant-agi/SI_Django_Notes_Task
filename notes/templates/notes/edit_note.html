{% extends 'notes/base.html' %}

{% block title %}Edit Note{% endblock %}

{% block content %}

<div class="container">

    <div class="card">

        <h1>Edit Note</h1>

        <form method="POST">

            {% csrf_token %}

            <label for="title">Title</label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ note.title }}"
                required
            >

            <br><br>

            <label for="content">Content</label>

            <textarea
                id="content"
                name="content"
                rows="10"
                required
            >{{ note.content }}</textarea>

            <div class="form-actions">

                <button type="submit">
                    Update Note
                </button>

                <a
                    href="{% url 'home' %}"
                    class="button secondary-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
