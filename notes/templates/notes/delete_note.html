{% extends 'notes/base.html' %}

{% block title %}Delete Note{% endblock %}

{% block content %}

<div class="container">

    <div class="card">

        <h1>Delete Note</h1>

        <p>
            Are you sure you want to delete this note?
        </p>

        <h2>{{ note.title }}</h2>

        <p>
            {{ note.content }}
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="form-actions">

                <button
                    type="submit"
                    class="danger-button"
                >
                    Yes, Delete
                </button>

                <a
                    href="{% url 'home' %}"
                    class="button secondary-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
