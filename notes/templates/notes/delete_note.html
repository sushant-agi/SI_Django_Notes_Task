<!DOCTYPE html>
<html>
<head>
    <title>Delete Note</title>
</head>
<body>

    <h1>Delete Note</h1>

    <p>Are you sure you want to delete this note?</p>

    <h2>{{ note.title }}</h2>
    <p>{{ note.content }}</p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">Yes, Delete</button>
    </form>

    <br>

    <a href="{% url 'home' %}">Cancel</a>

</body>
</html>
