<!DOCTYPE html>
<html>
<head>
    <title>My Notes</title>
</head>

<body>

    <h1>My Notes</h1>

    <p>Welcome, {{ user.username }}!</p>

    <a href="{% url 'create_note' %}">Create Note</a>
    <a href="{% url 'logout' %}">Logout</a>

    <hr>

    {% for note in notes %}

        <h2>{{ note.title }}</h2>

        <p>{{ note.content }}</p>

        <small>Created: {{ note.created_at }}</small>

        <hr>

    {% empty %}

        <p>You don't have any notes yet.</p>

    {% endfor %}

</body>
</html>
