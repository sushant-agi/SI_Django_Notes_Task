{% extends 'notes/base.html' %}

{% block content %}

<div class="forgot-container">

    <h2>Forgot Password</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            name="username"
            required
        >
        <br> <br>

        <button type="submit">Continue</button>
    </form>

    <p class="back-link">
        <a href="{% url 'login' %}">Back to Login</a>
    </p>

</div>

{% endblock %}
