{% extends 'notes/base.html' %}

{% block title %}Create Account{% endblock %}

{% block content %}

<div class="container">

    <div class="card">

        <h1>Create Account</h1>

        <form method="POST">

            {% csrf_token %}

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >

            <br><br>

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <br><br>

            <button type="submit">
                Register
            </button>

        </form>

        <p>
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>

    </div>

</div>

{% endblock %}
