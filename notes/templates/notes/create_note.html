{% extends 'notes/base.html' %}

{% block title %}Create Note{% endblock %}

{% block content %}

<div class="container">

    <div class="card">

        <h1>Create a New Note</h1>

        <form method="POST">

            {% csrf_token %}

            <label for="title">Title</label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="Enter note title"
                required
            >

            <br><br>

            <label for="content">Content</label>

            <textarea
                id="content"
                name="content"
                rows="10"
                placeholder="Write your note here..."
                required
            ></textarea>

            <br><br>

            <button type="submit">
                Save Note
            </button>

        </form>

        <br>

        <a href="{% url 'home' %}">
            ← Back to My Notes
        </a>

    </div>

</div>

{% endblock %}
