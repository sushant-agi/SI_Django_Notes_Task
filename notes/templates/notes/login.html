{% extends 'notes/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="container">

    <div class="card">

        <h1>Login</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >

            <br><br>

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <br><br>

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="{% url 'register' %}">Register</a>
        </p>

    </div>

</div>

{% endblock %}
